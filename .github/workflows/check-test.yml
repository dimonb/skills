name: check-test

# `make check-test` proves that every assertion in `scripts/check.sh` actually FIRES — it injects
# one violation per probe, requires the gate to red, and restores. It is what stands between a
# gate that works and a gate that is decoration: no other check in this repo asserts that
# check.sh's arms FIRE, which was true when this was written and which nothing keeps true. So it
# is never thinned and never sampled: it runs in FULL or not at all.
#
# IT IS A SEPARATE WORKFLOW FROM ci.yml FOR TWO REASONS.
#
# 1. CONCURRENCY. It is ~5 minutes of genuine CPU work (84 probes, each re-running the whole
#    static gate, measured at 142% CPU) and it does not compress: the probes mutate the shared
#    working tree, so parallelising them needs a copy of the tree per worker. Run in the same job
#    as `make check` + `make test` it is serialised behind them; run as its own workflow it
#    overlaps them, and a change's wall clock becomes the longer of the two rather than the sum.
# 2. RELEVANCE. What it proves can only be broken by a change that touches the gate, its probes,
#    the Makefile recipes those probes assert about, or a path a probe mutates. On a pull request
#    that touches none of those, five minutes buys nothing.
#
# ON A PUSH TO `main` IT RUNS UNCONDITIONALLY, with no filter at all. That is the backstop: a
# filter that turns out to be too narrow costs one late red at merge rather than a silent gap.
#
# THE FILTER IS DERIVED, NOT GUESSED. It is `$GUARDED` from scripts/check-test.sh with each
# directory spelt `<dir>/**`, PLUS `docs/**`. `scripts/check.sh` check 13 asserts the `$GUARDED`
# half entry by entry and reds if that list grows without this filter growing with it.
#
# `$GUARDED` IS AN UPPER BOUND ON WHAT THE PROBES RESTORE WITH GIT — NOT ON WHAT THEY MUTATE, and
# the difference is `docs/`. About twenty probes `mkdir -p docs`, write `docs/_probe.md` or
# `docs/stray/SKILL.md`, and remove them inline; `docs/` is untracked, so it cannot be in
# `$GUARDED` — `git checkout -- .claude docs Makefile` ABORTS on the unmatched pathspec and
# restores NOTHING, which under check-test's `2>/dev/null || true` would silently turn the whole
# restore into a no-op. Measured, not reasoned: `git checkout -- docs` exits 1 with 'pathspec
# did not match any file(s) known to git'. So `docs/**` is in the filter and deliberately not in
# `$GUARDED`, and that is the one standing exception rather than an oversight.
#
# WHAT NOTHING ENFORCES, stated plainly rather than left to be discovered: check 13 compares this
# filter against `$GUARDED`, and `$GUARDED` is a hand-maintained list, so an entry here that no
# `$GUARDED` line derives — `docs/**` is exactly that — is checked by nobody. The end-of-run
# cleanliness assertion makes an out-of-list mutation loud, but only for a probe that leaves a
# trace on disk; one that restores by hand, as the `docs/` probes do, satisfies both and is
# invisible here. A new probe touching a NEW tree needs a line in `$GUARDED` (if the tree is
# tracked) or a line here and a sentence in this paragraph (if it is not).
#
# THIS JOB MUST NOT BE CONFIGURED AS A REQUIRED STATUS CHECK. A path-filtered workflow that does
# not run reports nothing at all — not a skip — so a required check on it sits at 'Expected —
# waiting for status' for ever on any pull request the filter excludes. Require the CI workflow,
# which has no filter. (Not live today: this repo has no branch protection and no rulesets.)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.claude/**'
      - '.agents/**'
      - 'plugins/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - 'shared/**'
      - 'Makefile'
      - '.github/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    name: make check-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Needs a clean tree, INCLUDING untracked files under the paths it restores, which a fresh
      # checkout is.
      - name: make check-test
        run: make check-test
