name: check-test

# Trigger on every PR and main push: GitHub paths filters inspect at most 300 files.
# Select mutation coverage inside the job from the complete git range instead.
# Static validation still runs for every change; check 13 forbids outer path filters.

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-test:
    name: make check-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select gate coverage
        id: paths
        run: python3 scripts/ci_paths.py

      # Needs a clean tree, INCLUDING untracked files under the paths it restores, which a fresh
      # checkout is.
      - name: make check-test
        if: steps.paths.outputs.check_test == 'true'
        run: make check-test
