name: CI

# Runs this repo's own gate on every push to the default branch and on every pull request, so a
# suite that ERRORS at runtime — not just one that stops being registered — reds something the
# change has to pass. Local `make check` stays fast and deliberately does not run the slow suites;
# this workflow is where their runtime errors get caught (issue #91, decision C of #84).
#
# `make check-test` is NOT here. It lives in check-test.yml, as a SEPARATE workflow, so it runs
# CONCURRENTLY with this one instead of after it, and so it can be skipped on a pull request that
# cannot affect what it proves. That file carries the reasoning and the path filter; this one is
# the part every change pays.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the checkout and runs tests.
permissions:
  contents: read

# A newer run for the same ref supersedes an in-flight one, so a quick second push does not leave
# two full runs racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make check + test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The static gate plus every fast, pure suite; the Makefile's `check` recipe is the list.
      - name: make check
        run: make check

      # Every suite's fast subset, the two slow ones included — this is where a runtime error in
      # those surfaces, since `make check` deliberately does not run them.
      - name: make test
        run: make test
