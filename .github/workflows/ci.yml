name: CI

# Runs this repo's own gate on every push to the default branch and on every pull request, so a
# suite that ERRORS at runtime — not just one that stops being registered — reds something the
# change has to pass. Local `make check` stays fast and deliberately does not run the slow suites;
# this workflow is where their runtime errors get caught (issue #91, decision C of #84).
#
# `make check-test` is NOT here. It lives in check-test.yml, as a SEPARATE workflow, so it runs
# CONCURRENTLY with this one instead of after it, and so it can be skipped on a pull request that
# cannot affect what it proves. That file carries the reasoning and the path filter; this one is
# the part every change pays.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the gate only reads the checkout and runs tests.
permissions:
  contents: read

# A newer run for the same ref supersedes an in-flight one, so a quick second push does not leave
# two full runs racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: make check + test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The static gate plus every fast, pure suite; the Makefile's `check` recipe is the list.
      - name: make check
        run: make check

      # Every suite's fast subset, the two slow ones included — this is where a runtime error in
      # those surfaces, since `make check` deliberately does not run them.
      - name: make test
        run: make test

  # The shipyard report is run by stock macOS /bin/bash 3.2, and so is the continuity watcher it
  # launches. The tests that hold them to that run parts of them under /bin/bash — which on Linux is
  # 5.x, so there t15's floor prints a skip line (#332) and the others' /bin/bash sections pass
  # vacuously, as each says. This job runs those files on GitHub's macOS image, whose /bin/bash is
  # 3.2; each step's test body runs under the bash 5 installed below, so what each floors is only
  # what that test itself hands to /bin/bash. Helpers the report starts as `bash <script>` (the slot
  # graph, escalations, down) resolve a bash 5 here too (the shipyard README's Known limits). Which
  # files belong here is checked, not only remembered: scripts/check.sh check 16 reds when a gated
  # test names /bin/bash on a line it runs and no step below runs it; a floor reached through a
  # variable set elsewhere or a helper it cannot see, so such a test still needs its step added by
  # hand. t15 is the step that proves the 3.2 is there: it NAMES /bin/bash and fails, rather than
  # skips, when that is not a 3.x, so an image whose /bin/bash moves on reds this job instead of
  # making the others vacuous again. A bash >= 5 is installed beside it because the report's slot
  # graph is a subprocess that re-execs into one (a documented shipyard requirement); the report
  # without one is t15's no-bash-5 section, which stubs the graph's refusal. These files, not
  # `make test`: the rest already runs on Linux.
  bash32-floor:
    name: shipyard report bash 3.2 floor (macOS)
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install a bash >= 5 beside the stock 3.2
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash

      - name: t15 under /bin/bash 3.2
        env:
          SHIPYARD_TEST_BASH32: /bin/bash
        run: bash plugins/shipyard/skills/shipyard/tests/t15-iid-fallback.sh

      - name: t19 under /bin/bash 3.2
        run: bash plugins/shipyard/skills/shipyard/tests/t19-occupant.sh

      - name: t13 under /bin/bash 3.2
        run: bash plugins/shipyard/skills/shipyard/tests/t13-wait.sh

      - name: t17 under /bin/bash 3.2
        run: bash plugins/shipyard/skills/shipyard/tests/t17-autodown.sh

      - name: t-policy under /bin/bash 3.2
        run: bash shared/policy/tests/t-policy.sh

      - name: t-adapters under /bin/bash 3.2
        run: bash shared/adapters/tests/t-adapters.sh

      # The Codex continuity watcher is launched as `/bin/bash shipyard-continuity.sh ...`, and t7
      # and t21 drive that command through their fake agtermctl, so here the WATCHER runs under 3.2.
      # The code that starts it runs in the test's own bash 5 (the README's Known limits, KL-3).
      - name: t7 under /bin/bash 3.2
        run: bash plugins/shipyard/skills/shipyard/tests/t7-continuity.sh

      - name: t21 under /bin/bash 3.2
        run: bash plugins/shipyard/skills/shipyard/tests/t21-continuity-fifo.sh
